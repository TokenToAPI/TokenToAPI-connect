name: Windows release smoke test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published or draft release tag to test
        required: true
        default: v0.2.2
      previous_tag:
        description: Previous stable version to upgrade from
        required: true
        default: v0.2.1
permissions:
  # GitHub requires write access to read draft releases. This workflow never
  # writes release metadata and has no access to the updater signing key.
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid tag" }
          if ($env:PREVIOUS_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid previous tag" }
          $previousAsset = "TokenToAPI-Connect-$($env:PREVIOUS_TAG.Substring(1))-Windows-x64-setup.exe"
          $currentAsset = "TokenToAPI-Connect-$($env:RELEASE_TAG.Substring(1))-Windows-x64-setup.exe"
          gh release download $env:PREVIOUS_TAG --repo $env:REPOSITORY --pattern $previousAsset --dir previous
          if ($LASTEXITCODE -ne 0) { throw "Previous download failed" }
          gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $currentAsset
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern 'TokenToAPI-Connect-Windows-x64-setup.exe' --dir stable
          if ($LASTEXITCODE -ne 0) { throw "Stable download alias missing" }
          if ((Get-FileHash $currentAsset -Algorithm SHA256).Hash -ne (Get-FileHash 'stable/TokenToAPI-Connect-Windows-x64-setup.exe' -Algorithm SHA256).Hash) { throw "Stable alias differs from versioned installer" }
      - name: Install, launch, upgrade in place, and preserve settings
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $installer = (Get-Item "TokenToAPI-Connect-$($env:RELEASE_TAG.Substring(1))-Windows-x64-setup.exe").FullName
          $destination = Join-Path $env:LOCALAPPDATA 'TokenToAPI Connect'
          $config = Join-Path $env:USERPROFILE '.tokentoapi-connect'
          New-Item -ItemType Directory -Force $config | Out-Null
          $marker = Join-Path $config 'smoke-backup.txt'
          Set-Content $marker 'original settings preserved'
          $previous = (Get-Item "previous/TokenToAPI-Connect-$($env:PREVIOUS_TAG.Substring(1))-Windows-x64-setup.exe").FullName
          $install = Start-Process $previous -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $destination 'tokentoapi-connect.exe'
          if (!(Test-Path $exe)) { throw "Installed executable missing" }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne $env:PREVIOUS_TAG.Substring(1)) { throw "Wrong executable version: $version" }
          $app = Start-Process $exe -PassThru
          Start-Sleep 10
          $app.Refresh()
          if ($app.HasExited) { throw "App exited unexpectedly: $($app.ExitCode)" }
          if ($app.MainWindowHandle -eq 0) { throw "App window did not open" }
          Stop-Process -Id $app.Id -Force
          $upgrade = Start-Process $installer -ArgumentList @('/S', '/UPDATE') -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Update installer failed" }
          if ((Get-Content $marker -Raw).Trim() -ne 'original settings preserved') { throw "Settings changed" }
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $env:RELEASE_TAG.Substring(1)) { throw "Upgrade version mismatch" }
          $app = Start-Process $exe -PassThru
          Start-Sleep 10
          $app.Refresh()
          if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw "Updated app did not launch" }
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NativeMenu {
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr window);
            [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr menu, int index);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr menu);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuString(IntPtr menu, uint item, StringBuilder text, int size, uint flags);
            [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr menu, int index);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr wparam, IntPtr lparam);
          }
          '@
          $menu = [NativeMenu]::GetMenu($app.MainWindowHandle)
          $found = $false
          for ($i = 0; $i -lt [NativeMenu]::GetMenuItemCount($menu); $i++) {
            $label = New-Object System.Text.StringBuilder 256
            [void][NativeMenu]::GetMenuString($menu, $i, $label, 256, 0x400)
            if ($label.ToString().Replace('&', '') -eq 'Help') {
              $help = [NativeMenu]::GetSubMenu($menu, $i)
              [void][NativeMenu]::GetMenuString($help, 0, $label.Clear(), 256, 0x400)
              if ($label.ToString() -notlike 'Check for updates*') { throw "Update menu missing" }
              $command = [NativeMenu]::GetMenuItemID($help, 0)
              [void][NativeMenu]::SendMessage($app.MainWindowHandle, 0x111, [IntPtr]$command, [IntPtr]::Zero)
              $found = $true
            }
          }
          if (!$found) { throw "Help menu missing" }
          Start-Sleep 3
          $app.Refresh()
          if ($app.HasExited) { throw "Native update menu caused app exit" }
          Stop-Process -Id $app.Id -Force
          Write-Output "Installer, native launch, version-to-version update, settings preservation, and native Help update command passed."

  gemini-compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select release Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test configuration, backup and restore natively
        run: cargo +1.99.1 test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Install official Gemini CLI fixture
        run: npm install --prefix gemini-fixture @google/gemini-cli@0.46.0
      - name: Verify native Gemini requests using generated settings
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          $cli = (Resolve-Path 'gemini-fixture/node_modules/@google/gemini-cli/bundle/gemini.js').Path
          python scripts/verify-gemini-runtime.py --gemini node --gemini-script $cli --output gemini-windows-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-windows-runtime
          path: gemini-windows-runtime.json
