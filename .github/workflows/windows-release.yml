name: Windows release validation
on:
  workflow_dispatch:
  push:
    branches: [release/windows-0.1.3]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: rustup update stable
      - run: rustup component add rustfmt clippy
      - run: pnpm test:ui
      - run: pnpm test:lifecycle
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: pnpm build:windows
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Portable launch and protocol smoke
        run: node scripts/test-windows-portable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-v0.1.3
          path: |
            release/TokenToAPI-Connect-0.1.3-Windows-x64-portable.zip
            release/SHA256SUMS.txt
            release/windows-smoke.json
          if-no-files-found: error
